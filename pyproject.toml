[project]
name = "robot-wetlab"
version = "0.1.0"
description = "Prototype virtual robot wet lab: CPU twin, booking service and protocol SDK."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "pillow>=10",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",          # uvicorn needs it to serve the state WebSocket
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
usd = ["usd-core>=24.8"]   # author the Isaac Sim stage without Isaac
ur = ["ur_rtde>=1.5"]      # real Universal Robots driver

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "usd-core>=24.8"]

[project.scripts]
wetlab = "wetlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wetlab", "wetlab_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
